<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f472b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle (terminal window) -->
  <rect x="40" y="60" width="432" height="392" rx="24" ry="24" fill="#1e1e2e"/>

  <!-- Terminal top bar -->
  <rect x="40" y="60" width="432" height="48" rx="24" ry="24" fill="#313244"/>
  <rect x="40" y="84" width="432" height="24" fill="#313244"/>

  <!-- Window controls -->
  <circle cx="80" cy="84" r="10" fill="#f38ba8"/>
  <circle cx="112" cy="84" r="10" fill="#f9e2af"/>
  <circle cx="144" cy="84" r="10" fill="#a6e3a1"/>

  <!-- Grid of session windows (2x2) -->
  <!-- Top-left window -->
  <rect x="64" y="132" width="184" height="140" rx="8" ry="8" fill="#45475a"/>
  <!-- Prompt symbol > -->
  <text x="80" y="175" font-family="monospace" font-size="28" font-weight="bold" fill="url(#shellGrad)">❯</text>
  <rect x="108" y="158" width="80" height="4" rx="2" fill="#6c7086"/>
  <rect x="108" y="172" width="120" height="4" rx="2" fill="#585b70"/>
  <rect x="80" y="195" width="100" height="4" rx="2" fill="#6c7086"/>
  <rect x="80" y="209" width="140" height="4" rx="2" fill="#585b70"/>
  <rect x="80" y="232" width="60" height="4" rx="2" fill="#6c7086"/>

  <!-- Top-right window -->
  <rect x="264" y="132" width="184" height="140" rx="8" ry="8" fill="#45475a"/>
  <text x="280" y="175" font-family="monospace" font-size="28" font-weight="bold" fill="url(#accentGrad)">❯</text>
  <rect x="308" y="158" width="100" height="4" rx="2" fill="#6c7086"/>
  <rect x="308" y="172" width="80" height="4" rx="2" fill="#585b70"/>
  <rect x="280" y="195" width="120" height="4" rx="2" fill="#6c7086"/>
  <rect x="280" y="209" width="90" height="4" rx="2" fill="#585b70"/>
  <rect x="280" y="232" width="110" height="4" rx="2" fill="#6c7086"/>

  <!-- Bottom-left window -->
  <rect x="64" y="288" width="184" height="140" rx="8" ry="8" fill="#45475a"/>
  <text x="80" y="331" font-family="monospace" font-size="28" font-weight="bold" fill="url(#terminalGrad)">❯</text>
  <rect x="108" y="314" width="90" height="4" rx="2" fill="#6c7086"/>
  <rect x="108" y="328" width="110" height="4" rx="2" fill="#585b70"/>
  <rect x="80" y="351" width="80" height="4" rx="2" fill="#6c7086"/>
  <rect x="80" y="365" width="130" height="4" rx="2" fill="#585b70"/>
  <rect x="80" y="388" width="70" height="4" rx="2" fill="#6c7086"/>

  <!-- Bottom-right window (active/highlighted) -->
  <rect x="264" y="288" width="184" height="140" rx="8" ry="8" fill="#45475a" stroke="url(#shellGrad)" stroke-width="3"/>
  <text x="280" y="331" font-family="monospace" font-size="28" font-weight="bold" fill="url(#shellGrad)">❯</text>
  <rect x="308" y="314" width="70" height="4" rx="2" fill="url(#shellGrad)"/>
  <rect x="280" y="351" width="100" height="4" rx="2" fill="#6c7086"/>
  <rect x="280" y="365" width="60" height="4" rx="2" fill="#585b70"/>
  <rect x="280" y="388" width="90" height="4" rx="2" fill="#6c7086"/>

  <!-- Blinking cursor -->
  <rect x="386" y="308" width="12" height="20" rx="2" fill="url(#shellGrad)">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
